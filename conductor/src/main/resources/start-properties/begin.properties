build_directive.time=on
build_directive.list=directiveiv
build_directive.source=#all_planets()
build_directive.pause=10S

build_small_transporters.time=off
build_small_transporters.list=transporterSmall_1
build_small_transporters.source=#all_planets()
build_small_transporters.pause=3M

build_transporters.time=off
build_transporters.list=transporterLarge_1
build_transporters.source=#all_planets()
build_transporters.pause=8M

##########################################################################
main.time=on
main.template=templates/global.properties

consumer.source=#all()
consumer.login=<login>
consumer.password=<password>
consumer.hash=<server_hash>

update.refresh=30S



