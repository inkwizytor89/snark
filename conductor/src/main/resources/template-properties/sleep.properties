sleep.time=on
sleep.source=#fly_points
sleep.target=#next(#source, #fly_points)
sleep.mission=STATIONED
sleep.start_conditions=#areShips({planet: 'source', shipsMap: 'deathstar:1', leave: 'none'}) | #hasNoMissions({source: 'source', blockingMissions: 'TRANSPORT;ATTACK;EXPEDITION'})
#sleep.condition_ships_in_source=deathstar:1
#sleep.condition_blocking_missions=TRANSPORT;ATTACK;EXPEDITION
sleep.resources=all
sleep.leave_resources=nothing
sleep.speed=30
sleep.pause=1M